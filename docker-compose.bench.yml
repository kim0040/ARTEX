# ARTEX Tencent TSec Benchmark 이미지. 로컬에서 한 번에 build + run.
# 운영용 docker-compose.yml(artex와 postgres)과는 서로 영향을 주지 않습니다.
# 사용법:
#   cp bench/.env.example bench/.env   # LLM_API_KEY / BENCHMARK_TOKEN 등을 채움
#   docker compose -f docker-compose.bench.yml up --build      # 빌드하고 포그라운드로 실행(로그를 봄)
#   docker compose -f docker-compose.bench.yml up --build -d   # 백그라운드
#   docker compose -f docker-compose.bench.yml logs -f
#   docker compose -f docker-compose.bench.yml down            # 중지(-v 를 주면 데이터 볼륨도 삭제)
# 브라우저: http://localhost:8787 (ADMIN_PASSWORD 로 로그인)

services:
  artex-bench:
    build:
      context: .
      dockerfile: Dockerfile.bench
    image: artex-bench:latest
    container_name: artex-bench
    env_file:
      - bench/.env
    # 물리 머신과 네트워크를 공유합니다. 컨테이너가 호스트 네트워크 스택을 그대로 씁니다.
    # host 모드에서는 ports 매핑을 쓰지 않고 컨테이너가 호스트 포트에 직접 붙습니다.
    # 8787(UI/API), 8788(기록 프록시), 내부 PostgreSQL 5432. 이 세 포트가 비어 있어야 합니다.
    network_mode: host
    restart: "no"

volumes:
  artex_bench_data:
