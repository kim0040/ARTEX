services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:? .env에 POSTGRES_PASSWORD를 설정하세요}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  artex:
    image: autumn27/artex:${ARTEX_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTEX_PG_DSN: postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artex}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
    ports:
      - "8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # 데이터 디렉터리(jwt.key, SQLite 등)를 프로젝트 루트의 data/에 바인드합니다.
      # 호스트에서 바로 보고 백업할 수 있고, 컨테이너를 다시 만들어도 남습니다.
      - ./data:/app/data
      # 프로젝트 루트의 skills를 컨테이너에 마운트합니다(이미지 안의 /app/skills를 덮음).
      # 스킬을 고쳐도 이미지를 다시 만들 필요가 없습니다. 컨테이너는 호스트의 이 디렉터리를 읽습니다.
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
